stages:
  - release

release_composer:
  stage: release
  tags:
    - release
  script:
    - apk add curl
    - 'curl --silent --show-error --fail --header "Job-Token: $CI_JOB_TOKEN" --data tag=${CI_COMMIT_TAG} "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/packages/composer"'
  only:
    refs:
      - tags
